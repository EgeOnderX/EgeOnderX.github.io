<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Easyboot - Web Edition</title>
    <style>
        /* THEME VARIABLES */
        :root {
            --bg: #18181b;
            --panel: #27272a;
            --text: #f4f4f5;
            --text-muted: #a1a1aa;
            --input-bg: #09090b;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --border: #3f3f46;
            --dropdown-bg: #27272a;
            --dropdown-hover: #3f3f46;
            
            --log-info: #a1a1aa;
            --log-success: #22c55e;
            --log-warn: #eab308;
            --log-err: #ef4444;
            --log-wait: #38bdf8;
        }

        [data-theme="white"] {
            --bg: #f4f4f5;
            --panel: #ffffff;
            --text: #18181b;
            --text-muted: #71717a;
            --input-bg: #e4e4e7;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --border: #d4d4d8;
            --dropdown-bg: #ffffff;
            --dropdown-hover: #e4e4e7;
            
            --log-info: #52525b;
            --log-success: #16a34a;
            --log-warn: #ca8a04;
            --log-err: #dc2626;
            --log-wait: #0284c7;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: background-color 0.3s, color 0.3s;
        }

        /* NAVBAR */
        .navbar {
            background-color: var(--panel);
            border-bottom: 1px solid var(--border);
            height: 50px;
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 15px;
        }

        .btn {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        .btn:hover { background-color: var(--accent-hover); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .select-theme {
            background-color: var(--input-bg);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            outline: none;
        }

        .nav-link {
            color: var(--text-muted);
            text-decoration: underline;
            margin-left: auto;
            font-size: 14px;
            cursor: pointer;
        }
        .nav-link:hover { color: var(--accent); }

        /* MAIN LAYOUT */
        .main-container {
            display: flex;
            flex: 1;
            padding: 20px;
            gap: 20px;
            overflow: hidden;
        }

        /* LEFT PANEL */
        .left-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 450px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .input-group label {
            font-weight: bold;
            font-size: 14px;
        }
        .input-group input[type="text"] {
            background-color: var(--input-bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 10px;
            border-radius: 6px;
            outline: none;
        }
        .input-group input[type="text"]:focus {
            border-color: var(--accent);
        }

        .checkbox-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 5px;
        }
        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            font-size: 14px;
        }
        .checkbox-item input {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--accent);
        }

        .action-buttons {
            display: flex;
            gap: 10px;
        }
        .action-buttons .btn {
            flex: 1;
            padding: 12px;
        }

        /* LOG PANEL */
        .log-panel {
            background-color: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            flex: 1;
            padding: 10px;
            overflow-y: auto;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 13px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .log-info { color: var(--log-info); }
        .log-success { color: var(--log-success); }
        .log-warn { color: var(--log-warn); }
        .log-err { color: var(--log-err); }
        .log-wait { color: var(--log-wait); }

        /* RIGHT PANEL */
        .right-panel {
            flex: 1;
            background-color: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .preview-header {
            padding: 15px;
            font-weight: bold;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border);
            font-size: 14px;
        }
        .code-preview {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 13px;
            white-space: pre;
            color: var(--text);
            line-height: 1.4;
        }
        /* Basit Syntax Highlighting */
        .asm-comment { color: #22c55e; }
        .asm-macro { color: var(--accent); }

    </style>
</head>
<body>

    <!-- NAVBAR -->
    <div class="navbar">
        <select class="select-theme" id="themeSelect">
            <option value="dark">DARK</option>
            <option value="white">WHITE</option>
        </select>
        <button class="btn" onclick="simulateBoot()">Boot (QEMU Sim)</button>
        <a class="nav-link" href="https://github.com/EgeOnderX" target="_blank">GitHub</a>
    </div>

    <!-- MAIN LAYOUT -->
    <div class="main-container">
        
        <!-- LEFT PANEL -->
        <div class="left-panel">
            <div class="input-group">
                <label>Welcome String Message:</label>
                <input type="text" id="inpWelcome" value="Welcome to Easyboot!">
            </div>
            
            <div class="checkbox-grid">
                <label class="checkbox-item"><input type="checkbox" id="chkRam" checked> RAM Check</label>
                <label class="checkbox-item"><input type="checkbox" id="chkDisk" checked> Disk Check</label>
                <label class="checkbox-item"><input type="checkbox" id="chkA20"> Enable A20 Line</label>
                <label class="checkbox-item"><input type="checkbox" id="chkProt"> Protected Mode</label>
            </div>

            <div class="input-group">
                <label>Target Kernel Binary Filename:</label>
                <input type="text" id="inpKernel" value="KERNEL.BIN">
            </div>

            <div class="input-group">
                <label>Fallback Disk Failure Message:</label>
                <input type="text" id="inpDiskErr" value="Disk Error!">
            </div>

            <div class="action-buttons">
                <button class="btn" id="btnCreate" onclick="downloadASM()">DOWNLOAD .ASM</button>
                <button class="btn" id="btnISO" onclick="mockCreateISO()">COMPILE INFOS</button>
            </div>

            <div class="log-panel" id="logPanel">
                <!-- Logs will appear here -->
            </div>
        </div>

        <!-- RIGHT PANEL (PREVIEW) -->
        <div class="right-panel">
            <div class="preview-header">LIVE ASSEMBLY (ASM) PREVIEW</div>
            <div class="code-preview" id="codePreview"></div>
        </div>

    </div>

    <script>
        // --- THEME LOGIC ---
        const themeSelect = document.getElementById('themeSelect');
        const savedTheme = localStorage.getItem('easyboot_theme') || 'dark';
        
        if (savedTheme === 'white') {
            document.body.setAttribute('data-theme', 'white');
            themeSelect.value = 'white';
        }

        themeSelect.addEventListener('change', (e) => {
            const theme = e.target.value;
            if (theme === 'white') {
                document.body.setAttribute('data-theme', 'white');
            } else {
                document.body.removeAttribute('data-theme');
            }
            localStorage.setItem('easyboot_theme', theme);
        });

        // --- LOG SYSTEM ---
        const logPanel = document.getElementById('logPanel');
        function addLog(msg, type = "info") {
            const p = document.createElement('div');
            p.className = `log-${type}`;
            p.textContent = msg;
            logPanel.appendChild(p);
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        // Initialize log
        addLog("Ready. Configure parameters and click 'DOWNLOAD .ASM'.", "info");

        // --- ASM GENERATION ENGINE ---
        const ui = {
            welcome: document.getElementById('inpWelcome'),
            kernel: document.getElementById('inpKernel'),
            diskErr: document.getElementById('inpDiskErr'),
            ram: document.getElementById('chkRam'),
            disk: document.getElementById('chkDisk'),
            a20: document.getElementById('chkA20'),
            prot: document.getElementById('chkProt'),
            preview: document.getElementById('codePreview')
        };

        function generateASM() {
            const ram_macro = ui.ram.checked ? "1" : "0";
            const disk_macro = ui.disk.checked ? "1" : "0";
            const a20_macro = ui.a20.checked ? "1" : "0";
            const pmode_macro = ui.prot.checked ? "1" : "0";

            let asm = `; ==========================================
; Generated by Easyboot Bootloader Generator
; ==========================================
[org 0x7c00]

%define RAM_CHECK ${ram_macro}
%define DISK_CHECK ${disk_macro}
%define ENABLE_A20 ${a20_macro}
%define PROTECTED_MODE ${pmode_macro}

start:
    xor ax, ax
    mov ds, ax
    mov es, ax
    mov ss, ax
    mov sp, 0x7c00
    
    mov si, msg_welcome
    call print_string

%if RAM_CHECK == 1
    call do_ram_check
%endif

%if DISK_CHECK == 1
    call check_disk
    jc disk_error
%endif

%if ENABLE_A20 == 1
    call enable_a20
%endif

%if PROTECTED_MODE == 1
    call switch_to_pm
%endif

    ; Load kernel
    mov si, msg_load
    call print_string
    jmp $

print_string:
    mov ah, 0x0e
.loop:
    lodsb
    or al, al
    jz .done
    int 0x10
    jmp .loop
.done:
    ret

do_ram_check:
    int 0x12
    ret

check_disk:
    mov ah, 0x08
    mov dl, 0x80
    int 0x13
    ret

%if ENABLE_A20 == 1
enable_a20:
    in al, 0x92
    or al, 2
    out 0x92, al
    ret
%endif

%if PROTECTED_MODE == 1
switch_to_pm:
    cli
    lgdt [gdt_descriptor]
    mov eax, cr0
    or eax, 0x1
    mov cr0, eax
    jmp 0x08:init_pm
    
[bits 32]
init_pm:
    mov ax, 0x10
    mov ds, ax
    mov ss, ax
    mov es, ax
    mov fs, ax
    mov gs, ax
    mov ebp, 0x90000
    mov esp, ebp
    jmp $
[bits 16]

gdt_start:
    dq 0x0 
gdt_code: 
    dw 0xffff, 0x0, 0x9a00, 0x00cf 
gdt_data:
    dw 0xffff, 0x0, 0x9200, 0x00cf 
gdt_end:
gdt_descriptor:
    dw gdt_end - gdt_start - 1
    dd gdt_start
%endif

disk_error:
    mov si, msg_disk_err
    call print_string
    jmp $

msg_welcome  db '${ui.welcome.value}', 13, 10, 0
msg_load     db 'Loading ${ui.kernel.value}...', 13, 10, 0
msg_disk_err db '${ui.diskErr.value}', 13, 10, 0

times 510-($-$$) db 0
dw 0xaa55`;

            return asm;
        }

        // Apply syntax highlighting to preview
        function updatePreview() {
            let rawCode = generateASM();
            
            // Basic regex coloring for display
            let coloredCode = rawCode
                .replace(/;/g, '&#59;') // escape semicolons first to avoid html entity collision
                .replace(/^(&#59;.*)$/gm, '<span class="asm-comment">$1</span>')
                .replace(/(%define|%if|%endif)/g, '<span class="asm-macro">$1</span>');
                
            ui.preview.innerHTML = coloredCode;
        }

        // --- EVENT LISTENERS FOR LIVE UPDATE ---
        Object.values(ui).forEach(element => {
            if (element && element !== ui.preview) {
                element.addEventListener('input', updatePreview);
                element.addEventListener('change', updatePreview);
            }
        });

        // Initialize first render
        updatePreview();

        // --- BUTTON ACTIONS ---
        function downloadASM() {
            addLog("Please wait while your .asm file is generating...", "wait");
            setTimeout(() => {
                const text = generateASM();
                const blob = new Blob([text], { type: 'text/plain' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = 'bootloader.asm';
                a.click();
                URL.revokeObjectURL(a.href);
                addLog("SUCCESS: bootloader.asm downloaded successfully.", "success");
            }, 500);
        }

        function mockCreateISO() {
            addLog("Checking NASM environment...", "wait");
            setTimeout(() => {
                addLog("INFO: Web browser cannot run NASM or generate ISOs directly.", "warn");
                addLog("To compile: 1. Download ASM | 2. Run: nasm -f bin bootloader.asm -o bootloader.bin", "info");
            }, 800);
        }

        function simulateBoot() {
            addLog("Boot simulation triggered...", "wait");
            setTimeout(() => {
                addLog("ERROR: QEMU is a local executable. Cannot run via browser.", "err");
            }, 500);
        }

    </script>
</body>
</html>
